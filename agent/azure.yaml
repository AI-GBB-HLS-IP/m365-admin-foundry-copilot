# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Deployed from the in-VNet jumpbox (scripts/deploy-agent.ps1) because the Foundry project
# has public network access disabled. The Foundry account/project and model deployment are
# created by infra/ (template 15), so this project has no `ai-project` service and is never
# provisioned with azd -- only `azd deploy` is used.
requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.17'
    azure.ai.toolboxes: '>=1.0.0-beta.8'
name: jnj-m365-private-agent
services:
  # Foundry Toolbox: one governed MCP endpoint in the private project that fronts the
  # out-of-the-box Microsoft Learn MCP server. Tool traffic leaves through the agent
  # subnet and Azure Firewall (learn.microsoft.com is on the FQDN allow-list).
  learn-tools:
    host: azure.ai.toolbox
    description: Microsoft Learn MCP server for grounded Microsoft documentation answers
    tools:
      - type: mcp
        server_label: microsoft_learn
        server_url: https://learn.microsoft.com/api/mcp
        require_approval: never
  jnj-azure-advisor:
    host: azure.ai.agent
    project: src/jnj-azure-advisor
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - learn-tools
    kind: hosted
    name: jnj-azure-advisor
    displayName: JNJ Azure Advisor (POC)
    description: Answers Microsoft Azure, Foundry, and Microsoft 365 questions grounded in Microsoft Learn through an MCP tool.
    metadata:
      tags:
        - Agent Framework
        - Hosted Agent
        - Private Network
        - MCP
        - Foundry Toolbox
        - Microsoft 365
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_NAME: learn-tools
    container:
      # 1 CPU / 2Gi shortens cold start; M365/Teams surface "still processing" when the first
      # reply of a new conversation (new session container) takes ~30s at 0.5 CPU.
      resources:
        cpu: '1'
        memory: 2Gi
